<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>خريطة الفريق</title>
<style>
  :root {
    --background:#ffffff; --canvas:#fbfbfc; --surface:#f6f6f8; --foreground:#17171a;
    --muted:#6b6b74; --faint:#9a9aa2; --border:#e3e3e7; --border-strong:#d4d4d9;
    --accent:#2554eb; --accent-text:#ffffff; --owner-bg:#131316; --owner-text:#ffffff;
    --line:#d6d6db; --badge-employee-bg:#e0e9ff; --badge-employee-text:#1d3fc9;
    --badge-owner-bg:#131316; --badge-owner-text:#ffffff; --badge-freelancer-bg:#fdecd2;
    --badge-freelancer-text:#8a5a12; --badge-group-bg:#e7e7ea; --badge-group-text:#55555c;
    --shadow:0 1px 2px rgba(20,20,25,.04);
  }
  @media (prefers-color-scheme:dark){:root{
    --background:#0c0c0e; --canvas:#0c0c0e; --surface:#16161a; --foreground:#f2f2f4;
    --muted:#9d9da6; --faint:#6d6d76; --border:#27272c; --border-strong:#34343a;
    --accent:#4d79ff; --accent-text:#ffffff; --owner-bg:#f2f2f4; --owner-text:#131316;
    --line:#2c2c32; --badge-employee-bg:rgba(77,121,255,.16); --badge-employee-text:#9db4ff;
    --badge-owner-bg:#f2f2f4; --badge-owner-text:#131316; --badge-freelancer-bg:rgba(232,166,58,.16);
    --badge-freelancer-text:#e8b45c; --badge-group-bg:#202024; --badge-group-text:#b5b5bd; --shadow:none;
  }}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--background);color:var(--foreground);
    font-family:"SF Arabic","Segoe UI Arabic","Noto Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .chart-wrap{max-width:1180px;margin:0 auto;padding:40px 20px 80px}
  .chart-head{text-align:center;margin-bottom:44px}
  .chart-head h1{font-size:22px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
  .chart-head p{margin:0;color:var(--muted);font-size:13.5px}
  .node{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;
    border-radius:12px;background:var(--background);border:1px solid var(--border-strong);
    color:var(--foreground);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
    box-shadow:var(--shadow);transition:background .12s,color .12s,border-color .12s,transform .08s;white-space:nowrap}
  .node:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
  .node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .node-selected{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .node-owner{border-radius:999px;background:var(--owner-bg);color:var(--owner-text);
    border-color:var(--owner-bg);padding:12px 26px;font-size:14.5px;font-weight:700}
  .node-owner.node-selected{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .node-label{background:transparent;border-color:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:6px 10px}
  .node-label:hover:not(:disabled){transform:none}
  .node-label.node-selected{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .node-group{border-style:dashed;color:var(--muted);font-weight:600;padding:6px 14px;font-size:13px;border-radius:10px}
  .node-group.node-selected{color:var(--accent-text);border-style:solid}
  .stem-arrow{position:relative;width:2px;height:26px;background:var(--line);margin:12px auto}
  .stem-arrow::after{content:"";position:absolute;bottom:0;right:-3px;width:8px;height:8px;
    border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
  .trunk{display:flex;flex-direction:column;align-items:center}
  .col{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;position:relative}
  .row{display:flex;align-items:flex-start;justify-content:center;gap:12px;flex-wrap:wrap}
  /* levels = stacked rows of peers inside a department; drag a person between levels */
  .levels{display:flex;flex-direction:column;align-items:center;width:100%}
  .lvl{width:100%;display:flex;justify-content:center;border-radius:12px;padding:5px 0;transition:background .1s,outline-color .1s;outline:2px dashed transparent;outline-offset:3px}
  .lvl-target{outline-color:var(--accent);background:rgba(37,84,235,.06)}
  .pcard{position:relative;display:flex;align-items:center;justify-content:center}
  .pcard.dragging{opacity:.45}
  .grip{position:absolute;inset-inline-start:-7px;top:-8px;z-index:4;cursor:grab;touch-action:none;user-select:none;
    color:var(--muted);font-size:12px;line-height:1;background:var(--background);border:1px solid var(--border);border-radius:6px;padding:2px 4px}
  .grip:hover{color:var(--accent);border-color:var(--accent)}
  .grip:active{cursor:grabbing}
  #dropInd{position:fixed;height:4px;background:var(--accent);border-radius:3px;z-index:80;pointer-events:none;display:none;box-shadow:0 0 0 3px rgba(37,84,235,.2)}
  .branches{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-top:24px}
  .branches::before{content:"";position:absolute;top:0;left:16.6%;right:16.6%;height:0;border-top:2px solid var(--line)}
  .branches .col::before{content:"";position:absolute;top:-24px;right:50%;width:2px;height:24px;background:var(--line);transform:translateX(50%)}
  .divider{border:none;border-top:1px solid var(--border);margin:40px 0 28px}
  .more-hint{text-align:center;color:var(--faint);font-size:12px;margin-top:20px}
  .cross-band{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .cross-col{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .cross-title{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:12px}
  .arrow-ico{color:var(--faint)}
  .cross-wrap{display:flex;flex-wrap:wrap;gap:8px}
  .pa-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .detail{margin-top:36px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px 28px}
  .detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .detail-name{font-size:21px;font-weight:800;margin:0 0 4px}
  .detail-sub{color:var(--muted);font-size:13.5px;margin:0}
  .badge{flex-shrink:0;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
  .badge-employee{background:var(--badge-employee-bg);color:var(--badge-employee-text)}
  .badge-owner{background:var(--badge-owner-bg);color:var(--badge-owner-text)}
  .badge-freelancer{background:var(--badge-freelancer-bg);color:var(--badge-freelancer-text)}
  .badge-group{background:var(--badge-group-bg);color:var(--badge-group-text)}
  .detail-stats{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0 14px;padding:12px 0;
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px}
  .detail-stats b{color:var(--muted);font-weight:700}
  .detail-stats span{color:var(--foreground);font-weight:600}
  .detail-list{margin:0;padding:0;list-style:none}
  .detail-list li{position:relative;padding-right:18px;margin-bottom:9px;font-size:14px;line-height:1.6}
  .detail-list li::before{content:"";position:absolute;right:0;top:9px;width:5px;height:5px;border-radius:999px;background:var(--faint)}
  .empty-note{font-size:13.5px;color:var(--faint)}
  .tasks-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
  .tasks-title{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px}
  .task-list{list-style:none;margin:0;padding:0}
  .task-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
  .task-list li:last-child{border-bottom:none}
  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;
    background:var(--badge-group-bg);color:var(--badge-group-text);white-space:nowrap}
  .pill-priority{background:var(--badge-freelancer-bg);color:var(--badge-freelancer-text)}
  .state{max-width:1180px;margin:0 auto;padding:80px 20px;text-align:center;color:var(--muted);font-size:15px}
  .state.err{color:#dc2626}
  .admin-link{position:fixed;top:14px;left:14px;font-size:12.5px;font-weight:600;color:var(--muted);
    text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;background:var(--surface);z-index:10}
  .admin-link:hover{color:var(--accent);border-color:var(--accent)}
  @media (max-width:760px){
    body{overflow-x:hidden;padding-bottom:64px}
    .chart-wrap{padding:56px 12px 96px}
    .admin-link{top:10px;left:10px;padding:7px 12px;font-size:12px}
    .chart-head{margin-bottom:26px}
    .chart-head h1{font-size:19px}
    .chart-head p{font-size:12.5px}
    .branches{flex-direction:column;gap:8px}
    .branches::before,.branches .col::before{display:none}
    .col{margin-bottom:18px}
    .cross-band{grid-template-columns:1fr;gap:14px}
    /* bigger tap targets */
    .node{padding:12px 18px;font-size:14.5px}
    .node-label{padding:8px 12px;font-size:13px}
    .node-owner{padding:13px 24px}
    /* bigger, easier-to-grab drag handle on touch */
    .grip{font-size:16px;padding:7px 10px;inset-inline-start:-11px;top:-11px}
    .detail{padding:20px 15px;margin-top:28px}
    .detail-name{font-size:19px}
    .toolbar{gap:6px}
    .ebtn{padding:10px 14px}
    .ebtn-sm{padding:9px 13px;font-size:13px}
    .tabbar{padding-top:6px;min-height:52px}
    .tab{padding:12px 17px;font-size:14px}
    /* stop iOS Safari from zooming in when a field is focused */
    input,select,textarea{font-size:16px !important}
    .modal{max-width:100%;padding:22px 18px}
  }
  @media (prefers-reduced-motion:reduce){.node{transition:none}}
  /* editing controls (added; do not affect the tree look) */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.open{display:flex}
  .modal{width:100%;max-width:360px;background:var(--background);border:1px solid var(--border);border-radius:16px;padding:26px 24px}
  .mfield{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:14px}
  .mfield input{padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);font-size:14px;font-family:inherit}
  .lerr{color:#dc2626;font-size:12.5px;min-height:1px;margin:0 0 10px}
  .ebtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--border-strong);
    background:var(--background);color:var(--foreground);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none}
  .ebtn:hover{border-color:var(--accent)}
  .ebtn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .ebtn-danger{color:#dc2626;border-color:#dc2626}
  .ebtn-sm{padding:6px 10px;font-size:12px}
  .edit-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .addbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .addbar input{flex:1;min-width:130px;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);font-family:inherit;font-size:13.5px}
  .doc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .doc-row a{color:var(--foreground);text-decoration:none;font-weight:600;word-break:break-all;cursor:pointer}
  .doc-row a:hover{color:var(--accent)}
  .del-x{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px}
  .del-x:hover{color:#dc2626}
  .task-list li{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .task-list li .tlink{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:none;border:1px solid transparent;border-radius:9px;font:inherit;color:var(--foreground);font-weight:600;cursor:pointer;padding:8px 10px;text-align:start}
  .task-list li .tlink:hover{background:rgba(125,125,125,.10);border-color:var(--border)}
  .task-list li .tlink:hover .tlink-hint{color:var(--accent)}
  .tlink-hint{font-size:11.5px;font-weight:600;color:var(--faint)}
  .duties-hint{font-size:12px;color:var(--faint);margin:0 0 10px}
  .title-input{width:100%;font-size:21px;font-weight:800;padding:6px 8px;border-radius:9px;border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);font-family:inherit}
  .desc-input{width:100%;min-height:70px;margin-top:10px;padding:9px 11px;border-radius:10px;border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);font-family:inherit;font-size:13.5px;line-height:1.6;resize:vertical}
  .task-desc{margin:10px 0 0;font-size:14px;line-height:1.7;color:var(--muted)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--foreground);color:var(--background);
    padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.94}
  .toolbar{display:flex;gap:8px;justify-content:center;margin:-24px 0 28px;flex-wrap:wrap}
  /* Excel-style page tabs pinned to the bottom */
  body{padding-bottom:58px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;gap:3px;align-items:flex-end;
    background:var(--surface);border-top:1px solid var(--border);padding:8px 12px 0;overflow-x:auto;min-height:46px}
  .tab{flex:none;border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--foreground);background:rgba(125,125,125,.08)}
  .tab-active{color:var(--accent);background:var(--background);border-color:var(--border);border-bottom-color:var(--background);margin-bottom:-1px}
  .tab-add{font-size:17px;color:var(--muted);padding:6px 12px}
  .page-empty{text-align:center;padding:60px 20px}
  .tck-list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;margin-top:2px}
  .tck{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid transparent}
  .tck:hover{background:rgba(125,125,125,.10)}
  .tck input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex:none}
</style>
</head>

<script src="./supabase.js"></script>
<script>
const SUPA_URL = "https://wkmzxshebhkboliqsbib.supabase.co";
const SUPA_KEY = "sb_publishable_BuV9pAaraK7vLz1AtEn8zg_L97wdZFW";
const db = supabase.createClient(SUPA_URL, SUPA_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
let ME=null;
function canEdit(){ return ME && (ME.role==="admin"||ME.role==="editor"); }
async function loadMe(){
  const hasTok = Object.keys(localStorage).some(k=>k.startsWith("sb-")&&k.includes("-auth-token"));
  if(!hasTok){ ME=null; return; }
  // let the client refresh a stale-but-refreshable token, THEN validate it against the server
  let s=null; for(let i=0;i<15&&!s;i++){ s=(await db.auth.getSession()).data.session; if(!s) await new Promise(r=>setTimeout(r,180)); }
  if(!s){ ME=null; return; }
  // getUser() hits the auth server; if the session is actually dead it returns null → we treat as logged-out
  let uid=null;
  try{ const r=await db.auth.getUser(); if(!r.error && r.data && r.data.user) uid=r.data.user.id; }catch(_){ uid=null; }
  if(!uid){ ME=null; return; }
  const { data } = await db.from("app_users").select("id,email,app_role,is_disabled").eq("id",uid).maybeSingle();
  ME = (data && !data.is_disabled) ? { id:data.id, email:data.email, role:data.app_role } : null;
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
// in-page dialogs (native confirm()/prompt() are unreliable/suppressed in some mobile & in-app browsers)
function uiConfirm(message, okLabel){
  return new Promise(resolve=>{
    const wrap=document.createElement("div"); wrap.className="modal-bg open";
    wrap.innerHTML=`<div class="modal" style="max-width:340px">
        <p style="margin:0 0 20px;font-size:15.5px;font-weight:700;line-height:1.7">${esc(message)}</p>
        <div style="display:flex;gap:8px">
          <button class="ebtn ebtn-danger" id="ucYes" style="flex:1">${esc(okLabel||"حذف")}</button>
          <button class="ebtn" id="ucNo" style="flex:1">إلغاء</button>
        </div></div>`;
    document.body.appendChild(wrap);
    const done=v=>{ wrap.remove(); resolve(v); };
    wrap.querySelector("#ucYes").onclick=()=>done(true);
    wrap.querySelector("#ucNo").onclick=()=>done(false);
    wrap.addEventListener("click",e=>{ if(e.target===wrap) done(false); });
  });
}
function uiPrompt(message, placeholder){
  return new Promise(resolve=>{
    const wrap=document.createElement("div"); wrap.className="modal-bg open";
    wrap.innerHTML=`<div class="modal" style="max-width:360px">
        <label class="mfield" style="font-weight:700">${esc(message)}<input id="upIn" type="text" placeholder="${esc(placeholder||"")}"></label>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="ebtn ebtn-primary" id="upOk" style="flex:1">حفظ</button>
          <button class="ebtn" id="upNo">إلغاء</button>
        </div></div>`;
    document.body.appendChild(wrap);
    const inp=wrap.querySelector("#upIn"); inp.focus();
    const done=v=>{ wrap.remove(); resolve(v); };
    wrap.querySelector("#upOk").onclick=()=>done(inp.value.trim()||null);
    wrap.querySelector("#upNo").onclick=()=>done(null);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") done(inp.value.trim()||null); });
    wrap.addEventListener("click",e=>{ if(e.target===wrap) done(null); });
  });
}

// Fixed seed IDs — these define the exact chart layout (mirrors the app).
const P = {
  ali:"00000000-0000-0000-0000-0000000000a1", ahmad:"00000000-0000-0000-0000-0000000000a2",
  sami:"00000000-0000-0000-0000-0000000000a3", malek:"00000000-0000-0000-0000-0000000000a4",
  osama:"00000000-0000-0000-0000-0000000000a5", kamal:"00000000-0000-0000-0000-0000000000a6",
  ahsan:"00000000-0000-0000-0000-0000000000a7", haitham:"00000000-0000-0000-0000-0000000000a8",
  mohammed:"00000000-0000-0000-0000-0000000000a9", raafat:"00000000-0000-0000-0000-0000000000b2",
  anas:"00000000-0000-0000-0000-0000000000b1",
};

const classificationLabel = { owner:"Owner", employee:"موظف", freelancer:"Freelancer", not_yet_defined:"غير محدد" };

function formatManagerList(names){
  const clean = names.filter(n => n && n.trim().length>0);
  if(clean.length===0) return "";
  if(clean.length===1) return clean[0];
  return clean[0] + clean.slice(1).map(n=>" و"+n).join("");
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

async function sb(path){
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY }, cache:"no-store" });
  if(!r.ok) throw new Error("Supabase "+r.status+" على "+path);
  return r.json();
}

let DETAILS = {}, DEFAULT_ID = P.ahmad;
let LAST = {};
let CURRENT_PAGE = null; // null = the main org-chart page; otherwise a pages.id

function statusLabel(s){ return {not_yet_defined:"غير محددة",planned:"مخطط",in_progress:"قيد التنفيذ",done:"منجزة"}[s]||s; }

let selectedId = null;

function renderDetail(id){
  const d = DETAILS[id];
  const host = document.getElementById("detail");
  if(!d || !host) return;
  selectedId = id;
  document.querySelectorAll(".node").forEach(n=>n.classList.toggle("node-selected", n.dataset.detail===id));
  const ed = canEdit();
  const isPerson = d.kind==="person";
  // GROUP / static nodes keep their descriptive bullets (read-only text)
  const resp = d.resp||[];
  const respHtml = (!isPerson)
    ? (resp.length
        ? `<ul class="detail-list">${resp.map(r=>`<li>${esc(r.text)}</li>`).join("")}</ul>`
        : `<p class="empty-note">${esc(d.emptyNote||"لا توجد تفاصيل مسجّلة بعد.")}</p>`)
    : "";
  // PERSON: ONE clickable list = what he does. Click an item → its links + documents + files.
  const pill = t => (t.isTopPriority
      ? `<span class="pill pill-priority">${esc(statusLabel(t.status))}</span>`
      : (t.status==="in_progress"||t.status==="done") ? `<span class="pill">${esc(statusLabel(t.status))}</span>` : "");
  const dutyItems = (d.tasks && d.tasks.length)
    ? `<ul class="task-list">${d.tasks.map(t=>`<li>
         <button class="tlink" data-task="${t.id}">${esc(t.title)}<span class="tlink-hint">📎 روابط ومستندات ›</span></button>
         ${pill(t)}${ed?`<button class="del-x" data-deltask="${t.id}" title="حذف البند">×</button>`:""}</li>`).join("")}</ul>`
    : `<p class="empty-note">لا توجد بنود بعد.${ed?" اضغط «+ إضافة بند» لإضافة أول واحد.":""}</p>`;
  const dutiesBlock = isPerson
    ? `<div class="tasks-block"><div class="tasks-title">ماذا يعمل — المهام والمسؤوليات ${ed?`<button class="ebtn ebtn-sm" id="addTask" style="float:inline-end">+ إضافة بند</button>`:""}</div>
        <p class="duties-hint">اضغط على أي بند لفتحه وإضافة الروابط والمستندات والملفات.</p>${dutyItems}</div>` : "";
  // PERSON: two attachment boxes — the contract, and general work files/links. Both download only when logged in.
  const contractBlock = isPerson
    ? attSection("contract","📄","العقد والمستندات الرسمية","عقد هذا الشخص ومستنداته الرسمية — يفتحها الفريق بعد تسجيل الدخول.", ed)
      + attSection("document","📎","ملفات ومستندات إضافية","أي ملفات أو روابط متعلقة بالعمل (مجلد Drive، PDF…). اكتب اسمًا ثم أضِف الرابط، أو ارفع ملفًا.", ed)
    : "";
  const teamsAll = teamList(LAST.groups);
  const deptBlock = (ed && d.kind==="person" && teamsAll.length)
    ? `<div class="tasks-block"><div class="tasks-title">الأقسام / الفرق <span style="font-weight:500;color:var(--faint)">(ضع الشخص في أكثر من قسم ليظهر في كلٍّ منها)</span></div>
        <div class="tck-list">${teamsAll.map(g=>`<label class="tck"><input type="checkbox" data-teamtoggle="${g.id}" ${(d.teamIds||[]).includes(g.id)?"checked":""}> ${esc(g.name_ar)}</label>`).join("")}</div></div>` : "";
  const editRow = ed
    ? `<div class="edit-row">
        ${d.editHref?`<a class="ebtn ebtn-sm" href="${d.editHref}">تعديل الحقول ↗</a>`:""}
        ${(d.kind==="person"||d.kind==="group")?`<button class="ebtn ebtn-sm ebtn-danger" id="delNode">حذف</button>`:""}
       </div>` : "";
  host.innerHTML = `
    <div class="detail-top">
      <div><p class="detail-sub">${esc(d.subtitle)}</p><h2 class="detail-name">${esc(d.name)}</h2></div>
      <span class="badge badge-${d.badge}">${esc(d.badgeLabel)}</span>
    </div>
    <div class="detail-stats">
      <div><b>الفريق:</b> <span>${esc(d.team)}</span></div>
      <div><b>الإدارة:</b> <span>${esc(d.manager)}</span></div>
    </div>${respHtml}${dutiesBlock}${contractBlock}${deptBlock}${editRow}`;
  host.scrollIntoView({behavior:"smooth",block:"nearest"});
  // wire edit controls
  host.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>openTaskCard(b.dataset.task, id));
  if(isPerson){ wireAttachments(d.dbId, ed, "contract"); wireAttachments(d.dbId, ed, "document"); }
  if(!ed) return;
  host.querySelectorAll("[data-teamtoggle]").forEach(cb=>cb.onchange=async()=>{
    const gid=cb.dataset.teamtoggle;
    if(cb.checked){
      const { error }=await db.from("person_org_group_memberships").insert({ person_id:d.dbId, org_group_id:gid });
      if(error){ cb.checked=false; return toast("خطأ: "+error.message); }
    } else {
      const { error }=await db.from("person_org_group_memberships").delete().eq("person_id",d.dbId).eq("org_group_id",gid);
      if(error){ cb.checked=true; return toast("خطأ: "+error.message); }
    }
    await refreshKeep();
  });
  host.querySelectorAll("[data-deltask]").forEach(b=>b.onclick=async(e)=>{
    e.stopPropagation();
    if(!(await uiConfirm("حذف هذا البند؟")))return;
    const { data:upd, error }=await db.from("tasks").update({deleted_at:new Date().toISOString()}).eq("id",b.dataset.deltask).select("id");
    if(error) return toast("تعذّر الحذف: "+error.message);
    if(!upd||!upd.length) return toast("لم يتمّ الحذف — سجّل الخروج ثم الدخول وحاول مجددًا");
    toast("تم الحذف"); await refreshKeep();
  });
  const at=document.getElementById("addTask"); at&&(at.onclick=async()=>{
    const title=await uiPrompt("البند الجديد — ماذا يعمل هذا الشخص؟","اكتب المهمة أو المسؤولية"); if(!title)return;
    const { data, error }=await db.from("tasks").insert({ title:title.trim(), status:"not_yet_defined" }).select("id").single();
    if(error) return toast("خطأ: "+error.message);
    const { error:ae }=await db.from("task_assignments").insert({ task_id:data.id, person_id:d.dbId });
    if(ae) return toast("خطأ: "+ae.message);
    // just add it and return to the person — the item is saved; click it later to attach links/files
    toast("أُضيف البند ✓"); await refreshKeep();
  });
  const dn=document.getElementById("delNode"); dn&&(dn.onclick=async()=>{
    if(!(await uiConfirm(d.kind==="person"?"حذف هذا الشخص نهائيًا؟":"حذف هذا القسم؟")))return;
    let res;
    if(d.kind==="person"){
      // remove the person's links first so no blank "?" card is left behind, then soft-delete
      await db.from("person_org_group_memberships").delete().eq("person_id",d.dbId);
      await db.from("org_group_managers").delete().eq("person_id",d.dbId);
      await db.from("task_assignments").delete().eq("person_id",d.dbId);
      res=await db.from("people").update({deleted_at:new Date().toISOString()}).eq("id",d.dbId).select("id");
    } else {
      await db.from("person_org_group_memberships").delete().eq("org_group_id",d.dbId);
      await db.from("org_group_managers").delete().eq("org_group_id",d.dbId);
      res=await db.from("org_groups").update({deleted_at:new Date().toISOString()}).eq("id",d.dbId).select("id");
    }
    if(res.error) return toast("تعذّر الحذف: "+res.error.message);
    if(!res.data||!res.data.length) return toast("لم يتمّ الحذف — سجّل الخروج ثم الدخول وحاول مجددًا");
    toast("تم الحذف"); await refreshAll();
  });
}

// task detail rendered into the same detail card (documents organized per task)
async function openTaskCard(taskId, backId){
  const host=document.getElementById("detail"); if(!host)return;
  host.innerHTML=`<p class="empty-note">جارٍ التحميل…</p>`;
  const t=await db.from("tasks").select("*").eq("id",taskId).maybeSingle().then(r=>r.data);
  if(!t){ host.innerHTML="<p class='empty-note'>المهمة غير موجودة.</p>"; return; }
  const [asg,people,links,files]=await Promise.all([
    db.from("task_assignments").select("person_id").eq("task_id",taskId).then(r=>r.data||[]),
    db.from("people").select("id,full_name_ar").is("deleted_at",null).then(r=>r.data||[]),
    db.from("links").select("*").eq("task_id",taskId).is("deleted_at",null).then(r=>r.data||[]),
    db.from("files").select("*").eq("task_id",taskId).is("deleted_at",null).then(r=>r.data||[]),
  ]);
  const pName=new Map(people.map(p=>[p.id,p.full_name_ar]));
  const assignees=asg.map(a=>pName.get(a.person_id)).filter(Boolean);
  const ed=canEdit();
  const statusOpts=Object.entries({not_yet_defined:"غير محددة",planned:"مخطط",in_progress:"قيد التنفيذ",done:"منجزة"}).map(([v,l])=>`<option value="${v}" ${t.status===v?"selected":""}>${l}</option>`).join("");
  host.innerHTML=`
    <button class="ebtn ebtn-sm ebtn-primary" id="taskBack" style="margin-bottom:10px">${ed?"✓ حفظ ورجوع":"→ رجوع"}</button>
    ${ed?`<p class="duties-hint" style="margin:0 0 12px">كل تغيير هنا يُحفظ تلقائيًا. أضِف الروابط أو الملفات إن رغبت، ثم اضغط «حفظ ورجوع».</p>`:""}
    <div class="detail-top"><div style="flex:1;min-width:0"><p class="detail-sub">${esc(assignees.join("، ")||"بند")}</p>
      ${ed?`<input id="tTitle" class="title-input" value="${esc(t.title)}">`:`<h2 class="detail-name">${esc(t.title)}</h2>`}</div></div>
    ${ed?`<textarea id="tDesc" class="desc-input" placeholder="الوصف / التفاصيل (اختياري)">${esc(t.description||"")}</textarea>`:(t.description?`<p class="task-desc">${esc(t.description)}</p>`:"")}
    ${ed?`<div class="detail-stats"><div><b>الحالة:</b> <select id="tStatus" style="margin-inline-start:6px;padding:4px 8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);font-family:inherit">${statusOpts}</select></div></div>`:`<div class="detail-stats"><div><b>الحالة:</b> <span>${esc(statusLabel(t.status))}</span></div></div>`}
    <div class="tasks-title" style="margin-top:16px">الروابط والمستندات الخارجية</div>
    <div id="linkList">${links.length?links.map(l=>`<div class="doc-row"><a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label||l.url)}</a>${ed?`<button class="del-x" data-dellink="${l.id}">×</button>`:""}</div>`).join(""):`<p class="empty-note">لا توجد روابط.</p>`}</div>
    ${ed?`<div class="addbar"><input id="lUrl" placeholder="https://..."><button class="ebtn ebtn-sm" id="lAdd">إضافة رابط</button></div>`:""}
    <div class="tasks-title" style="margin-top:16px">الملفات (PDF / Word / صور — حتى 10 ميجابايت)</div>
    <div id="fileList">${files.length?files.map(f=>`<div class="doc-row"><a data-file="${esc(f.storage_path)}">📄 ${esc(f.original_filename)}</a>${ed?`<button class="del-x" data-delfile="${f.id}" data-path="${esc(f.storage_path)}">×</button>`:""}</div>`).join(""):`<p class="empty-note">لا توجد ملفات.</p>`}</div>
    ${ed?`<div style="margin-top:10px"><input type="file" id="fUp"> <span class="empty-note" id="fMsg"></span></div>`:""}`;
  document.getElementById("taskBack").onclick=async()=>{
    if(ed){ // belt-and-suspenders: persist title/description even if the field didn't fire onchange
      const tt=document.getElementById("tTitle"), tds=document.getElementById("tDesc");
      const v=tt?tt.value.trim():""; if(v) await db.from("tasks").update({ title:v, description:(tds?tds.value.trim():"")||null }).eq("id",taskId);
    }
    if(backId) renderDetail(backId);
  };
  host.querySelectorAll("[data-file]").forEach(a=>a.onclick=async()=>{
    const { data, error }=await db.storage.from("task-files").createSignedUrl(a.dataset.file,120);
    if(error||!data) return toast("تحميل الملفات يتطلب تسجيل الدخول");
    window.open(data.signedUrl,"_blank");
  });
  if(!ed)return;
  const tt=document.getElementById("tTitle"); tt&&(tt.onchange=async()=>{ const v=tt.value.trim(); if(!v){ tt.value=t.title; return toast("العنوان لا يمكن أن يكون فارغًا"); } await db.from("tasks").update({title:v}).eq("id",taskId); toast("حُفظ العنوان"); });
  const tds=document.getElementById("tDesc"); tds&&(tds.onchange=async()=>{ await db.from("tasks").update({description:tds.value.trim()||null}).eq("id",taskId); toast("حُفظت التفاصيل"); });
  document.getElementById("tStatus")&&(document.getElementById("tStatus").onchange=async e=>{ await db.from("tasks").update({status:e.target.value}).eq("id",taskId); toast("حُدّثت الحالة"); });
  document.getElementById("lAdd").onclick=async()=>{
    const url=document.getElementById("lUrl").value.trim(); if(!url)return toast("أدخل رابطًا");
    let type="other"; if(url.includes("drive.google"))type="drive"; else if(url.includes("notion."))type="notion";
    const { error }=await db.from("links").insert({ task_id:taskId, url, link_type:type });
    if(error) return toast("خطأ: "+error.message); openTaskCard(taskId,backId);
  };
  host.querySelectorAll("[data-dellink]").forEach(b=>b.onclick=async()=>{ await db.from("links").delete().eq("id",b.dataset.dellink); openTaskCard(taskId,backId); });
  const up=document.getElementById("fUp"); up&&(up.onchange=async()=>{
    const f=up.files[0]; if(!f)return; if(f.size>10*1024*1024) return toast("الملف أكبر من 10 ميجابايت");
    document.getElementById("fMsg").textContent="جارٍ الرفع…";
    const path=`${taskId}/${crypto.randomUUID()}-${f.name}`;
    const { error:ue }=await db.storage.from("task-files").upload(path,f);
    if(ue){ document.getElementById("fMsg").textContent=""; return toast("خطأ بالرفع: "+ue.message); }
    const { error }=await db.from("files").insert({ task_id:taskId, storage_path:path, original_filename:f.name, mime_type:f.type||null, size_bytes:f.size });
    if(error) return toast("خطأ: "+error.message); openTaskCard(taskId,backId);
  });
  host.querySelectorAll("[data-delfile]").forEach(b=>b.onclick=async()=>{
    await db.storage.from("task-files").remove([b.dataset.path]);
    await db.from("files").delete().eq("id",b.dataset.delfile); openTaskCard(taskId,backId);
  });
}

// A reusable per-person attachment box (files + titled links). category = 'contract' or 'document'.

      <div class="tasks-title">${icon} ${esc(title)}</div>
      <p class="duties-hint">${esc(hint)}</p>
      <div class="att-box"><p class="empty-note">جارٍ التحميل…</p></div>
      ${ed?`<div class="addbar">
          <input class="att-title" placeholder="الاسم / العنوان (اختياري)">
          <input class="att-url" placeholder="الرابط https://…">
          <button class="ebtn ebtn-sm att-linkadd">إضافة رابط</button>
        </div>
        <div style="margin-top:10px"><label class="ebtn ebtn-sm att-uplabel">⬆️ رفع ملف (حتى 10 ميجابايت)<input type="file" class="att-file" style="display:none"></label><span class="empty-note att-msg" style="margin-inline-start:8px"></span></div>`:""}

// Files download via signed URL (login required); link metadata is public.
async function wireAttachments(personId, ed, category){
  const sec=document.querySelector(`.att-section[data-cat="${category}"]`); if(!sec) return;
  const box=sec.querySelector(".att-box"); if(!box) return;
  const [links,files]=await Promise.all([
    db.from("links").select("*").eq("person_id",personId).eq("category",category).is("deleted_at",null).then(r=>r.data||[]),
    db.from("files").select("*").eq("person_id",personId).eq("category",category).is("deleted_at",null).then(r=>r.data||[]),
  ]);
  const rows=[
    ...files.map(f=>`<div class="doc-row"><a data-af="${esc(f.storage_path)}">📄 ${esc(f.original_filename)}</a>${ed?`<button class="del-x" data-delaf="${f.id}" data-path="${esc(f.storage_path)}">×</button>`:""}</div>`),
    ...links.map(l=>`<div class="doc-row"><a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label||l.url)}</a>${ed?`<button class="del-x" data-delal="${l.id}">×</button>`:""}</div>`),
  ];
  box.innerHTML = rows.length ? rows.join("") : `<p class="empty-note">لا يوجد شيء بعد.${ed?" أضِف رابطًا أو ارفع ملفًا بالأسفل.":""}</p>`;
  box.querySelectorAll("[data-af]").forEach(a=>a.onclick=async()=>{
    const { data, error }=await db.storage.from("task-files").createSignedUrl(a.dataset.af,120);
    if(error||!data) return toast("الفتح يتطلب تسجيل الدخول"); window.open(data.signedUrl,"_blank");
  });
  if(!ed) return;
  box.querySelectorAll("[data-delal]").forEach(b=>b.onclick=async()=>{
    if(!(await uiConfirm("حذف هذا الرابط؟")))return;
    await db.from("links").delete().eq("id",b.dataset.delal); toast("حُذف"); wireAttachments(personId,ed,category);
  });
  box.querySelectorAll("[data-delaf]").forEach(b=>b.onclick=async()=>{
    if(!(await uiConfirm("حذف هذا الملف؟")))return;
    await db.storage.from("task-files").remove([b.dataset.path]);
    await db.from("files").delete().eq("id",b.dataset.delaf); toast("حُذف"); wireAttachments(personId,ed,category);
  });
  const la=sec.querySelector(".att-linkadd"); la&&(la.onclick=async()=>{
    const urlEl=sec.querySelector(".att-url"), titleEl=sec.querySelector(".att-title");
    const url=urlEl.value.trim(); if(!url) return toast("أدخل رابطًا");
    const label=titleEl.value.trim()||null;
    let type="other"; if(url.includes("drive.google"))type="drive"; else if(url.includes("notion."))type="notion";
    const { error }=await db.from("links").insert({ person_id:personId, category, url, label, link_type:type });
    if(error) return toast("خطأ: "+error.message);
    urlEl.value=""; titleEl.value=""; toast("أُضيف الرابط"); wireAttachments(personId,ed,category);
  });
  const fi=sec.querySelector(".att-file"); fi&&(fi.onchange=async()=>{
    const f=fi.files[0]; if(!f) return; if(f.size>10*1024*1024) return toast("الملف أكبر من 10 ميجابايت");
    const msg=sec.querySelector(".att-msg"); if(msg) msg.textContent="جارٍ الرفع…";
    const path=`${category}/${personId}/${crypto.randomUUID()}-${f.name}`;
    const { error:ue }=await db.storage.from("task-files").upload(path,f);
    if(ue){ if(msg) msg.textContent=""; return toast("خطأ بالرفع: "+ue.message); }
    const { error }=await db.from("files").insert({ person_id:personId, category, storage_path:path, original_filename:f.name, mime_type:f.type||null, size_bytes:f.size });
    if(error){ if(msg) msg.textContent=""; return toast("خطأ: "+error.message); }
    if(msg) msg.textContent=""; toast("أُضيف الملف"); wireAttachments(personId,ed,category);
  });
}
// refresh helpers: re-fetch + rebuild, keeping the open detail
async function refreshKeep(){ const keep=selectedId; await refreshAll(keep); }
async function refreshAll(keep){ await boot(keep||selectedId); }

function nodeHtml(label, kind, detailId){
  const cls = "node " + (kind==="owner"?"node-owner ":kind==="label"?"node-label ":kind==="group"?"node-group ":"");
  return `<button type="button" class="${cls.trim()}" data-detail="${detailId||""}" ${detailId?"":"disabled"}>${esc(label)}</button>`;
}

function build(data){
  const people = data.people, groups = data.groups;
  const personById = new Map(people.map(p=>[p.id,p]));
  const groupBySlug = new Map(groups.map(g=>[g.slug,g]));
  const nameOf = id => personById.get(id)?.full_name_ar ?? "";
  const byId = id => personById.get(id);

  // roles / responsibilities / memberships / managers / tasks maps
  const rolesById = new Map(data.roles.map(r=>[r.id,r.name_ar]));
  const rolesByPerson = new Map();
  data.personRoles.forEach(pr=>{ const a=rolesByPerson.get(pr.person_id)||[]; a.push(rolesById.get(pr.role_id)); rolesByPerson.set(pr.person_id,a.filter(Boolean)); });
  const respByPerson = new Map();
  data.responsibilities.forEach(r=>{ const a=respByPerson.get(r.person_id)||[]; a.push({id:r.id,text:r.description_ar}); respByPerson.set(r.person_id,a); });
  const memberGroupsByPerson = new Map();
  data.memberships.forEach(m=>{ const a=memberGroupsByPerson.get(m.person_id)||[]; a.push(m.org_group_id); memberGroupsByPerson.set(m.person_id,a); });
  const managersByGroup = new Map();
  const managerIdsByGroup = new Map();
  [...data.managers].sort((a,b)=>a.display_order-b.display_order).forEach(m=>{
    const a=managersByGroup.get(m.org_group_id)||[]; a.push(nameOf(m.person_id)); managersByGroup.set(m.org_group_id,a);
    const b=managerIdsByGroup.get(m.org_group_id)||[]; b.push(m.person_id); managerIdsByGroup.set(m.org_group_id,b);
  });
  const memberIdsByGroup = new Map();
  data.memberships.forEach(m=>{ const a=memberIdsByGroup.get(m.org_group_id)||[]; a.push(m.person_id); memberIdsByGroup.set(m.org_group_id,a); });
  // members grouped into LEVELS (each level = one row of peers, side by side), sorted within a level by display_order
  const levelMapByGroup = new Map(); // gid -> Map(level -> [{id,order}])
  data.memberships.forEach(m=>{
    const lm=levelMapByGroup.get(m.org_group_id)||new Map();
    const arr=lm.get(m.level||0)||[]; arr.push({id:m.person_id, order:m.display_order??0});
    lm.set(m.level||0, arr); levelMapByGroup.set(m.org_group_id, lm);
  });
  const levelRows = gid => { const lm=levelMapByGroup.get(gid); if(!lm) return [];
    return [...lm.keys()].sort((a,b)=>a-b)
      .map(lv=>lm.get(lv).sort((a,b)=>a.order-b.order).map(x=>x.id).filter(id=>personById.has(id)))
      .filter(row=>row.length); };
  const tasksByPerson = new Map();
  const taskById = new Map(data.tasks.map(t=>[t.id,t]));
  data.assignments.forEach(a=>{ const t=taskById.get(a.task_id); if(!t)return; const arr=tasksByPerson.get(a.person_id)||[]; arr.push({id:t.id,title:t.title,status:t.status,isTopPriority:t.is_top_priority,createdAt:t.created_at}); tasksByPerson.set(a.person_id,arr); });
  tasksByPerson.forEach(arr=>arr.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))));

  const groupById = new Map(groups.map(g=>[g.id,g]));

  // ---- detail cards ----
  DETAILS = {};
  people.forEach(p=>{
    const roles = rolesByPerson.get(p.id)||[];
    const memberGroups = groups.filter(g=>(memberIdsByGroup.get(g.id)||[]).includes(p.id));
    const teams = memberGroups.map(g=>g.name_ar);
    const teamIds = memberGroups.filter(g=>g.group_type==="team").map(g=>g.id);
    const badge = p.classification==="owner"?"owner":p.classification==="freelancer"?"freelancer":"employee";
    DETAILS[p.id] = {
      kind:"person", dbId:p.id, editHref:`./admin.html#/people/${p.id}`,
      name: p.nickname ? `${p.full_name_ar} «${p.nickname}»` : p.full_name_ar,
      subtitle: roles.slice(0,2).join(" · ") || "—",
      badge, badgeLabel: classificationLabel[p.classification],
      team: teams.join(" / ") || "—", teamIds,
      manager: p.manager_id ? (byId(p.manager_id)?.full_name_ar ?? "—") : "—",
      resp: respByPerson.get(p.id)||[],
      tasks: tasksByPerson.get(p.id)||[],
    };
  });
  groups.forEach(g=>{
    const typeLabel = g.group_type==="team"?"فريق":g.group_type==="function"?"وظيفة":"مجموعة";
    DETAILS[g.slug] = {
      kind:"group", dbId:g.id, editHref:`./admin.html#/teams/${g.id}`,
      name: g.name_ar, subtitle: g.description ?? "—", badge:"group", badgeLabel:typeLabel,
      team: g.parent_group_id ? (groupById.get(g.parent_group_id)?.name_ar ?? "—") : "Teams",
      manager: formatManagerList(g.group_type==="team" ? (levelRows(g.id)[0]||[]).map(nameOf) : (managersByGroup.get(g.id)||[])) || "—",
      resp: [], emptyNote:"لم تُحدد التفاصيل بعد.",
    };
  });
  DETAILS["teams"] = { kind:"static", name:"Teams", subtitle:"المظلة التي تضم الفرق الثلاثة", badge:"group", badgeLabel:"قسم رئيسي",
    team:"—", manager:"—", resp:[
      {text:"يتفرّع إلى ثلاثة فرق فقط: Management وMedia وSales."},
      {text:"Freelancers تصنيف عمل، وOperations وظيفة عابرة للفرق — وليسا فريقًا رابعًا."} ] };

  // ---- node builders ----
  const pNode = (id, kind="person") => nodeHtml(byId(id)?.full_name_ar ?? "?", kind, id);
  const pNodeIf = (id, kind="person") => byId(id) ? pNode(id, kind) : ""; // skip deleted/missing people (no "?" ghost)
  const gNode = (slug, kind="group") => { const g=groupBySlug.get(slug); return nodeHtml(g?.name_ar ?? slug, kind, slug); };
  const mgmtId = groupBySlug.get("management")?.id, mediaId = groupBySlug.get("media")?.id, salesId = groupBySlug.get("sales")?.id;
  const editing = canEdit();
  // a person is a draggable card; drag it to any LEVEL (row of peers) or into the gap between levels to make a new level
  const pCard = (id, teamId) => `<div class="pcard" data-person="${id}" data-team="${teamId}">${editing?`<span class="grip" data-grip title="اسحب لتغيير مستواه ومكانه">⠿</span>`:""}${pNode(id)}</div>`;
  // render a department's people as stacked LEVELS (top level = managers), peers side by side within a level
  const deptLevels = (teamId) => {
    const rows = levelRows(teamId);
    if(!rows.length) return `<div class="levels" data-team="${teamId}"><span class="empty-note">لا أعضاء بعد — أضِف شخصًا</span></div>`;
    return `<div class="levels" data-team="${teamId}">${rows.map((ids,i)=>`${i>0?`<div class="stem-arrow"></div>`:""}<div class="lvl" data-level="${i}"><div class="row">${ids.map(id=>pCard(id,teamId)).join("")}</div></div>`).join("")}</div>`;
  };
  const teamCol = g => `<div class="col">${nodeHtml(g.name_ar,"label",g.slug)}<div class="stem-arrow"></div>${deptLevels(g.id)}</div>`;
  const pages = data.pages || [];
  // guard: if the current page was deleted, fall back to the main org page
  if(CURRENT_PAGE!=null && !pages.some(p=>p.id===CURRENT_PAGE)) CURRENT_PAGE=null;
  const isOrg = (CURRENT_PAGE==null);
  const curPage = isOrg ? null : pages.find(p=>p.id===CURRENT_PAGE);

  const toolbar = canEdit() ? `<div class="toolbar">
      <button class="ebtn ebtn-sm" id="addPersonBtn">+ شخص</button>
      <button class="ebtn ebtn-sm" id="addDeptBtn">+ ${isOrg?"قسم / فريق":"عمود"}</button>
      ${!isOrg?`<button class="ebtn ebtn-sm ebtn-danger" id="delPageBtn">حذف الصفحة</button>`:""}
    </div>` : "";

  // ---- main content: the org chart (page 1) or a standalone page board ----
  let mainHtml, headHtml;
  if(isOrg){
    const knownTeams = ["management","media","sales"];
    const newTeams = groups.filter(g=>g.group_type==="team" && !knownTeams.includes(g.slug) && !g.page_id);
    headHtml = `<div class="chart-head"><h1>خريطة الفريق</h1><p>اضغط على أي اسم أو مجموعة لعرض تفاصيلها بالأسفل</p></div>`;
    mainHtml = `
    <div class="trunk">${nodeHtml("علي — صاحب الشركة","owner",P.ali)}<div class="stem-arrow"></div>${nodeHtml("Teams","label","teams")}</div>
    <div class="branches">
      <div class="col">${nodeHtml("Management","label","management")}<div class="stem-arrow"></div>${deptLevels(mgmtId)}</div>
      <div class="col">${nodeHtml("Media","label","media")}<div class="stem-arrow"></div>${deptLevels(mediaId)}<div class="stem-arrow"></div>${gNode("freelance-editors")}</div>
      <div class="col">${nodeHtml("Sales","label","sales")}<div class="stem-arrow"></div>${deptLevels(salesId)}<div class="stem-arrow"></div>${gNode("funnel-engineering","label")}<div class="stem-arrow"></div>
        <div class="row">${gNode("setters")}${gNode("closers")}${gNode("marketing")}</div></div>
      ${newTeams.map(teamCol).join("")}
    </div>
    <div class="more-hint">علاقات عابرة للفرق بالأسفل</div>
    <hr class="divider" />
    <div class="cross-band">
      <div class="cross-col"><div class="cross-title"><span class="arrow-ico">←</span> Freelancers</div>
        <div class="cross-wrap">${gNode("setters")}${gNode("closers")}${pNodeIf(P.raafat)}${pNodeIf(P.anas)}${gNode("freelance-editors")}</div></div>
      <div class="cross-col"><div class="cross-title"><span class="arrow-ico">←</span> Operations</div>
        <div class="cross-wrap">${pNodeIf(P.kamal)}${pNodeIf(P.osama)}</div></div>
      <div class="cross-col"><div class="cross-title">علاقة شخصية مباشرة</div>
        <div class="pa-line">${pNodeIf(P.ali)}<span class="arrow-ico">←</span>${pNodeIf(P.kamal)}</div></div>
    </div>`;
  } else {
    const cols = groups.filter(g=>g.page_id===CURRENT_PAGE);
    headHtml = `<div class="chart-head"><h1>${esc(curPage.name_ar)}</h1><p>صفحة مستقلة — أضِف الأعمدة واسحب العناصر لترتيبها</p></div>`;
    mainHtml = cols.length
      ? `<div class="branches">${cols.map(teamCol).join("")}</div>`
      : `<div class="page-empty"><p class="empty-note">هذه الصفحة فارغة.${canEdit()?" اضغط «+ عمود» ثم «+ شخص» لبنائها.":""}</p></div>`;
  }

  const tabbar = `<div class="tabbar">
      <button class="tab ${isOrg?"tab-active":""}" data-page="">الفريق</button>
      ${pages.map(p=>`<button class="tab ${p.id===CURRENT_PAGE?"tab-active":""}" data-page="${p.id}">${esc(p.name_ar)}</button>`).join("")}
      ${canEdit()?`<button class="tab tab-add" id="addPageBtn" title="أضِف صفحة">＋</button>`:""}
    </div>`;

  const html = `
  <div class="chart-wrap">
    ${headHtml}
    ${toolbar}
    ${mainHtml}
    <div class="detail" id="detail"></div>
  </div>
  ${tabbar}`;

  document.getElementById("app").innerHTML = html;
  document.querySelectorAll(".node").forEach(n=>{
    if(!n.dataset.detail) return;
    n.addEventListener("click", ()=>renderDetail(n.dataset.detail));
  });
  document.querySelectorAll(".tab[data-page]").forEach(t=>t.onclick=()=>{
    const pid=t.dataset.page||null;
    if(pid===CURRENT_PAGE) return;
    CURRENT_PAGE=pid; build({...LAST});
  });
  const apg=document.getElementById("addPageBtn"); apg&&(apg.onclick=addPageFlow);
  const dpg=document.getElementById("delPageBtn"); dpg&&(dpg.onclick=delPageFlow);
  wireDrag();
  const ap=document.getElementById("addPersonBtn"); ap&&(ap.onclick=addPersonFlow);
  const ad=document.getElementById("addDeptBtn"); ad&&(ad.onclick=addDeptFlow);
  // pick a default detail: keep the open one, else on the org page show the owner, else the page's first column
  let first = (data.keepId && DETAILS[data.keepId]) ? data.keepId : null;
  if(!first) first = isOrg ? DEFAULT_ID : (groups.find(g=>g.page_id===CURRENT_PAGE)?.slug || null);
  if(first && DETAILS[first]) renderDetail(first);
  else document.getElementById("detail").innerHTML = `<p class="empty-note">اختر عنصرًا من الأعلى لعرض تفاصيله.</p>`;
}

// teams available for the CURRENT page (org page = groups with no page_id; a page = its own groups)
function teamList(groups){ return (groups||[]).filter(g=>g.group_type==="team"); }
function pageTeams(){ return teamList(LAST.groups).filter(g=> CURRENT_PAGE==null ? !g.page_id : g.page_id===CURRENT_PAGE); }
// add a person and place them in ONE OR MORE departments at once (checkbox modal)
function addPersonFlow(){
  const teams=pageTeams();
  if(!teams.length) return toast(CURRENT_PAGE==null?"أضِف قسمًا أولاً":"أضِف عمودًا أولاً");
  const wrap=document.createElement("div");
  wrap.className="modal-bg open";
  wrap.innerHTML=`<div class="modal">
      <h3 style="margin:0 0 16px;font-size:18px;font-weight:800">إضافة شخص</h3>
      <label class="mfield">الاسم<input id="apName" type="text" placeholder="اسم الشخص"></label>
      <div class="tasks-title" style="margin:12px 0 6px">في أي قسم / فريق؟ <span style="font-weight:500">(يمكن اختيار أكثر من واحد)</span></div>
      <div class="tck-list">${teams.map(g=>`<label class="tck"><input type="checkbox" value="${g.id}"> ${esc(g.name_ar)}</label>`).join("")}</div>
      <div style="display:flex;gap:8px;margin-top:18px">
        <button class="ebtn ebtn-primary" id="apSave" style="flex:1">إضافة</button>
        <button class="ebtn" id="apCancel">إلغاء</button>
      </div></div>`;
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.querySelector("#apCancel").onclick=close;
  wrap.addEventListener("click",e=>{ if(e.target===wrap) close(); });
  const nameInput=wrap.querySelector("#apName"); nameInput.focus();
  nameInput.addEventListener("keydown",e=>{ if(e.key==="Enter") wrap.querySelector("#apSave").click(); });
  wrap.querySelector("#apSave").onclick=async()=>{
    const name=nameInput.value.trim(); if(!name) return toast("أدخل الاسم");
    const chosen=[...wrap.querySelectorAll(".tck input:checked")].map(i=>i.value);
    const { data, error }=await db.from("people").insert({ full_name_ar:name, classification:"employee" }).select("id").single();
    if(error) return toast("خطأ: "+error.message);
    if(chosen.length){
      const { error:me }=await db.from("person_org_group_memberships").insert(chosen.map(gid=>({ person_id:data.id, org_group_id:gid, level:nextLevel(gid) })));
      if(me) return toast("خطأ: "+me.message);
    }
    close(); toast("أُضيف الشخص — اسحبه إلى مكانه"); await refreshAll(data.id);
  };
}
// next (bottom) level for a team so a new person appears as a fresh row, then gets dragged into place
function nextLevel(gid){ const rows=(LAST.memberships||[]).filter(m=>m.org_group_id===gid); return rows.length?Math.max(...rows.map(m=>m.level??0))+1:0; }

// ================= DRAG A PERSON TO ANY LEVEL / POSITION IN A DEPARTMENT =================
let DRAG=null, DROPIND=null;
function ensureDropInd(){ if(!DROPIND){ DROPIND=document.createElement("div"); DROPIND.id="dropInd"; document.body.appendChild(DROPIND); } return DROPIND; }
function wireDrag(){ document.querySelectorAll(".pcard [data-grip]").forEach(g=>g.addEventListener("pointerdown", dragStart)); }
function dragStart(e){
  const card=e.target.closest(".pcard"); if(!card) return;
  const levelsEl=card.closest(".levels"); if(!levelsEl) return;
  e.preventDefault(); e.stopPropagation();
  DRAG={ card, levelsEl, teamId:levelsEl.dataset.team, target:null };
  card.classList.add("dragging");
  document.body.style.userSelect="none";
  window.addEventListener("pointermove", dragMove);
  window.addEventListener("pointerup", dragEnd, { once:true });
}
function dragMove(e){
  if(!DRAG) return;
  DRAG.target = computeTarget(DRAG.levelsEl, e.clientX, e.clientY, DRAG.card);
  paintTarget(DRAG.levelsEl, DRAG.target);
}
function computeTarget(levelsEl, x, y, card){
  const lvls=[...levelsEl.querySelectorAll(".lvl")];
  for(let i=0;i<lvls.length;i++){
    const r=lvls[i].getBoundingClientRect();
    if(y>=r.top-6 && y<=r.bottom+6){
      const cards=[...lvls[i].querySelectorAll(".pcard")].filter(c=>c!==card);
      let idx=cards.length;
      for(let j=0;j<cards.length;j++){ const cr=cards[j].getBoundingClientRect(); if(x > cr.left+cr.width/2){ idx=j; break; } }
      return { type:"peer", level:i, index:idx };
    }
  }
  let pos=lvls.length;
  for(let i=0;i<lvls.length;i++){ const r=lvls[i].getBoundingClientRect(); if(y < (r.top+r.bottom)/2){ pos=i; break; } }
  return { type:"newlevel", position:pos };
}
function paintTarget(levelsEl, t){
  levelsEl.querySelectorAll(".lvl").forEach(l=>l.classList.remove("lvl-target"));
  const ind=ensureDropInd(); ind.style.display="none";
  if(!t) return;
  const lvls=[...levelsEl.querySelectorAll(".lvl")];
  if(t.type==="peer"){ lvls[t.level]&&lvls[t.level].classList.add("lvl-target"); return; }
  const colRect=levelsEl.getBoundingClientRect();
  let top;
  if(t.position<=0){ top = (lvls[0]?lvls[0].getBoundingClientRect().top:colRect.top)-6; }
  else if(t.position>=lvls.length){ top = (lvls[lvls.length-1]?lvls[lvls.length-1].getBoundingClientRect().bottom:colRect.bottom)+4; }
  else { const a=lvls[t.position-1].getBoundingClientRect(), b=lvls[t.position].getBoundingClientRect(); top=(a.bottom+b.top)/2; }
  ind.style.display="block"; ind.style.position="fixed";
  ind.style.left=colRect.left+"px"; ind.style.width=colRect.width+"px"; ind.style.top=top+"px";
}
async function dragEnd(){
  const d=DRAG; DRAG=null;
  window.removeEventListener("pointermove", dragMove);
  document.body.style.userSelect="";
  if(DROPIND) DROPIND.style.display="none";
  if(!d) return;
  d.card.classList.remove("dragging");
  d.levelsEl.querySelectorAll(".lvl").forEach(l=>l.classList.remove("lvl-target"));
  const t=d.target; if(!t) return;
  const pid=d.card.dataset.person, teamId=d.teamId;
  // read current arrangement from the DOM, apply the move, renumber, persist
  let lvls=[...d.levelsEl.querySelectorAll(".lvl")].map(l=>[...l.querySelectorAll(".pcard")].map(c=>c.dataset.person));
  lvls.forEach(lv=>{ const i=lv.indexOf(pid); if(i>=0) lv.splice(i,1); });
  if(t.type==="peer"){ (lvls[t.level]=lvls[t.level]||[]).splice(t.index,0,pid); }
  else { lvls.splice(t.position,0,[pid]); }
  lvls=lvls.filter(lv=>lv.length);
  const updates=[];
  lvls.forEach((lv,li)=>lv.forEach((personId,oi)=>updates.push(
    db.from("person_org_group_memberships").update({ level:li, display_order:oi }).eq("person_id",personId).eq("org_group_id",teamId))));
  const res=await Promise.all(updates);
  const bad=res.find(r=>r.error);
  if(bad) toast("خطأ في الحفظ: "+bad.error.message); else toast("تم النقل");
  await refreshKeep();
}
// =========================================================================================
async function addDeptFlow(){
  const label = CURRENT_PAGE==null ? "القسم / الفريق" : "العمود";
  const name=await uiPrompt(`اسم ${label} الجديد`, label); if(!name)return;
  const base=name.trim().toLowerCase().replace(/\s+/g,"-").replace(/[^\w\-]/g,"")||"col";
  const slug=base+"-"+Math.floor(Math.random()*1e6); // keep slugs unique across pages
  const { data, error }=await db.from("org_groups").insert({ name_ar:name.trim(), slug, group_type:"team", page_id:CURRENT_PAGE }).select("slug").single();
  if(error) return toast("خطأ: "+error.message);
  toast("أُضيف "+label); await refreshAll(data.slug);
}
// ---- pages (Excel-style tabs) ----
async function addPageFlow(){
  const name=await uiPrompt("اسم الصفحة الجديدة","مثال: قمع المبيعات"); if(!name)return;
  const pos=(LAST.pages||[]).length;
  const { data, error }=await db.from("pages").insert({ name_ar:name.trim(), position:pos }).select("id").single();
  if(error) return toast("تعذّر إضافة الصفحة: "+error.message);
  CURRENT_PAGE=data.id; toast("أُضيفت الصفحة"); await refreshAll();
}
async function delPageFlow(){
  if(CURRENT_PAGE==null) return;
  if(!(await uiConfirm("حذف هذه الصفحة وكل أعمدتها؟")))return;
  const pid=CURRENT_PAGE;
  const groupIds=(LAST.groups||[]).filter(g=>g.page_id===pid).map(g=>g.id);
  if(groupIds.length){
    await db.from("person_org_group_memberships").delete().in("org_group_id",groupIds);
    await db.from("org_group_managers").delete().in("org_group_id",groupIds);
  }
  const { data, error }=await db.from("pages").delete().eq("id",pid).select("id");
  if(error) return toast("تعذّر حذف الصفحة: "+error.message);
  if(!data||!data.length) return toast("لم يتمّ الحذف — سجّل الخروج ثم الدخول وحاول مجددًا");
  CURRENT_PAGE=null; toast("حُذفت الصفحة"); await refreshAll();
}

async function boot(keepId){
  try {
    const [people, groups, managers, memberships, roles, personRoles, responsibilities, assignments, tasks, pages] = await Promise.all([
      sb("people?deleted_at=is.null&select=*"),
      sb("org_groups?deleted_at=is.null&select=*"),
      sb("org_group_managers?select=*&order=display_order"),
      sb("person_org_group_memberships?select=*"),
      sb("roles?select=*"),
      sb("person_roles?select=*"),
      sb("responsibilities?select=id,person_id,description_ar,display_order&order=display_order"),
      sb("task_assignments?select=*"),
      sb("tasks?deleted_at=is.null&select=id,title,status,is_top_priority,created_at&order=created_at"),
      sb("pages?select=*&order=position"),
    ]);
    LAST = {people, groups, managers, memberships, roles, personRoles, responsibilities, assignments, tasks, pages};
    build({...LAST, keepId});
  } catch(e){
    document.getElementById("app").innerHTML = `<div class="state err">تعذّر تحميل البيانات.<br>${esc(e.message)}</div>`;
  }
}

// ---- auth wiring ----
const authLink=document.getElementById("authLink");
authLink.onclick=async(e)=>{ e.preventDefault(); if(ME){ await db.auth.signOut(); location.reload(); } else document.getElementById("loginModal").classList.add("open"); };
document.getElementById("loginCancel").onclick=()=>document.getElementById("loginModal").classList.remove("open");
document.getElementById("loginGo").onclick=async()=>{
  document.getElementById("lerr").textContent="";
  const { error }=await db.auth.signInWithPassword({ email:document.getElementById("lemail").value.trim(), password:document.getElementById("lpw").value });
  if(error){ document.getElementById("lerr").textContent="تعذّر الدخول. تحقق من البيانات."; return; }
  location.reload();
};
document.getElementById("lpw").addEventListener("keydown",e=>{ if(e.key==="Enter")document.getElementById("loginGo").click(); });

(async function(){ await loadMe(); authLink.textContent = ME ? "خروج" : "دخول للتعديل ↗"; await boot(); })();
